kind = "web"
previewPath = "/"
title = "Senlac Guest House"
version = "1.0.0"
id = "artifacts/senlac-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25252

[services.development]
run = "pnpm --filter @workspace/senlac-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/senlac-website", "run", "build" ]
publicDir = "artifacts/senlac-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25252"
BASE_PATH = "/"
